[project]
name = "gen-rootfs"
version = "0.1.0"
description = "RootFS生成工具 - 将ISO、QCOW2和Docker镜像转换为rootfs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pexpect>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"

